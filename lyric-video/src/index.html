<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lyric video</title>
<style>
/* Fontes locais (SIL OFL): Inter para o latim e Noto Sans Hebrew para o hebraico com nikud */
@font-face{font-family:'Inter';src:url('../assets/fonts/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Inter';src:url('../assets/fonts/inter-latin-wght-italic.woff2') format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Inter';src:url('../assets/fonts/inter-latin-ext-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Noto Sans Hebrew';src:url('../assets/fonts/noto-sans-hebrew-hebrew-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Noto Sans Hebrew';src:url('../assets/fonts/noto-sans-hebrew-hebrew-500-normal.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Noto Sans Hebrew';src:url('../assets/fonts/noto-sans-hebrew-hebrew-600-normal.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Noto Sans Hebrew';src:url('../assets/fonts/noto-sans-hebrew-hebrew-700-normal.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Noto Sans Hebrew';src:url('../assets/fonts/noto-sans-hebrew-hebrew-800-normal.woff2') format('woff2');font-weight:800}

html,body{margin:0;background:#14163e;overflow:hidden}
#quadro{position:relative;overflow:hidden;font-family:'Inter','Noto Sans Hebrew',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;font-kerning:normal;
  /* cores adaptativas (o main.js troca entre texto claro e escuro conforme o céu) */
  --ink:#fff;--dim:rgba(255,255,255,.34);--translit:#cfe3ff;--traducao:#ffe7a3;--glow:rgba(255,214,240,.95);
  --k1:#ffc4e1;--k2:#ffe9ad;--veu:rgba(24,20,84,.38);--u:1}
#cena{position:absolute;left:0;top:0}
#veu{position:absolute;inset:0;opacity:0;pointer-events:none}

/* ---------- legenda ---------- */
#legenda{position:absolute;inset:0;pointer-events:none}
.estrofe{position:absolute;inset:0;visibility:hidden}
.linha{position:absolute;left:8%;top:0;width:84%;text-align:center;transform-origin:50% 50%;color:var(--ink)}
.principal{font-weight:700;font-size:calc(var(--u)*92px);line-height:1.18;letter-spacing:-.022em}
.linha.he .principal{font-size:calc(var(--u)*96px);letter-spacing:0;line-height:1.34}
.linha.he .translit{font-size:calc(var(--u)*36px)}
.linha.he .traducao{font-size:calc(var(--u)*40px)}
.pal{position:relative;display:inline-block;margin:0 .14em;white-space:pre}
.pal .base{color:var(--dim)}
.pal .luz,.pal .brilho{position:absolute;left:0;top:0;white-space:pre}
.pal .luz{color:var(--ink)}
.pal .brilho{color:var(--glow);filter:blur(calc(var(--u)*14px));opacity:0}
.pal.dest .luz{background:linear-gradient(100deg,var(--k1),var(--k2));-webkit-background-clip:text;background-clip:text;color:transparent}
.translit{font-style:italic;font-weight:500;font-size:calc(var(--u)*40px);color:var(--translit);margin-top:.22em;letter-spacing:.01em}
.traducao{font-weight:600;font-size:calc(var(--u)*44px);color:var(--traducao);margin-top:.14em}

/* ---------- abertura ---------- */
#abertura{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;visibility:hidden;color:#fff;text-align:center;padding-top:calc(var(--u)*72px);box-sizing:border-box}
.ab-bloco{display:flex;flex-direction:column;align-items:center}
.ab-titulo{display:flex;font-weight:800;font-size:calc(var(--u)*112px);letter-spacing:.14em;line-height:1.1;text-shadow:0 4px 44px rgba(40,30,110,.55)}
.ab-l{display:inline-block;will-change:transform}
.ab-he{font-family:'Noto Sans Hebrew','Inter',sans-serif;font-weight:700;font-size:calc(var(--u)*84px);line-height:1.4;margin-top:.1em}
.ab-he span{display:inline-block;background:linear-gradient(100deg,#fff2cc,#ffd6ac 60%,#ffc4dc);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 16px rgba(70,40,130,.5))}
.ab-tr{font-style:italic;font-weight:500;font-size:calc(var(--u)*36px);color:#e4f2ff;margin-top:.1em;letter-spacing:.02em;text-shadow:0 2px 20px rgba(40,30,110,.7),0 0 3px rgba(40,30,110,.3)}
.ab-vers{margin-top:calc(var(--u)*22px);padding:calc(var(--u)*9px) calc(var(--u)*28px);border-radius:999px;background:rgba(52,42,120,.30);
  border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 10px 40px rgba(50,30,120,.25);
  font-weight:600;font-size:calc(var(--u)*30px);color:#ffe7a3;letter-spacing:.04em}
.ab-linha{width:calc(var(--u)*220px);height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);margin-top:calc(var(--u)*42px)}
.ab-canal{margin-top:calc(var(--u)*20px);font-weight:600;font-size:calc(var(--u)*34px);letter-spacing:.2em;text-shadow:0 2px 26px rgba(30,20,90,.5)}
.ab-aviso{margin-top:calc(var(--u)*16px);font-weight:400;font-size:calc(var(--u)*20px);line-height:1.55;color:rgba(224,240,255,.92);text-shadow:0 1px 14px rgba(30,20,90,.55)}

/* ---------- encerramento: cartão holográfico picotado ---------- */
#fim{position:absolute;left:50%;top:37%;opacity:0;pointer-events:none}
.tk-corpo{position:relative;background:linear-gradient(160deg,#fffdf6,#fff6ec 55%,#f6f0ff);--ang:0deg}
.tk-holo{position:absolute;inset:0;opacity:.62;mix-blend-mode:multiply;
  background:linear-gradient(to bottom,rgba(255,248,205,.7),rgba(255,255,255,0) 62%),
  conic-gradient(from var(--ang) at 62% 48%,#ffc9df,#d3c6ff,#c4e9ff,#c9f7dd,#fff0b8,#ffd3c2,#ffc9df)}
.tk-brilho{position:absolute;inset:0;mix-blend-mode:soft-light;
  background:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 68%);background-size:260% 100%}
.tk-cont{position:absolute;inset:0;padding:calc(var(--u)*34px) calc(var(--u)*26px) calc(var(--u)*24px);display:flex;flex-direction:column;align-items:center;text-align:center;color:#2a2860}
.tk-titulo{font-weight:800;font-size:calc(var(--u)*44px);letter-spacing:.1em;line-height:1.1;mix-blend-mode:normal}
.tk-fio{width:70%;height:2px;margin:calc(var(--u)*16px) 0 calc(var(--u)*6px);background:repeating-linear-gradient(90deg,#2a2860 0 8px,transparent 8px 14px);opacity:.35}
.tk-he{font-family:'Noto Sans Hebrew','Inter',sans-serif;font-weight:700;font-size:calc(var(--u)*62px);line-height:1.5;margin-top:calc(var(--u)*8px)}
.tk-he span{background:linear-gradient(100deg,#d2557f,#f08a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.tk-tr{font-style:italic;font-weight:500;font-size:calc(var(--u)*25px);color:#4657d6}
.tk-tx{font-weight:600;font-size:calc(var(--u)*27px);color:#a9660b;margin-top:calc(var(--u)*6px)}
.tk-rodape{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12px)}
.tk-canal{font-weight:600;font-size:calc(var(--u)*17px);letter-spacing:.12em}
.tk-barras{display:flex;gap:calc(var(--u)*3px);height:calc(var(--u)*46px);align-items:stretch}
.tk-barras i{display:block;background:#2a2860;opacity:.82}

/* ---------- acabamento ---------- */
#grao{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.06;pointer-events:none;background-size:256px 256px}
#fade{position:absolute;inset:0;background:#14163e;opacity:1;pointer-events:none}
</style>
</head>
<body>
<div id="quadro">
  <canvas id="cena"></canvas>
  <div id="veu"></div>
  <div id="legenda"></div>
  <div id="abertura"></div>
  <div id="fim"></div>
  <div id="grao"></div>
  <div id="fade"></div>
</div>
<script src="util.js"></script>
<script src="paleta.js"></script>
<script src="personagens.js"></script>
<script src="cena.js"></script>
<script src="legenda.js"></script>
<script src="abertura.js"></script>
<script src="main.js"></script>
</body>
</html>
